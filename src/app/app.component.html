<ion-app>
  <ion-split-pane contentId="contenido-principal" when="lg">
    <ion-menu contentId="contenido-principal" type="overlay">
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>Menú</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <ion-list lines="none">
          @for (pagina of paginas; track pagina.ruta) {
            <ion-menu-toggle autoHide="false">
              <ion-item
                [routerLink]="[pagina.ruta]"
                routerDirection="root"
                routerLinkActive="item-activo"
                detail="false"
              >
                <ion-icon slot="start" [name]="pagina.icono"></ion-icon>
                <ion-label>{{ pagina.titulo }}</ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="contenido-principal"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
